<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation25 | GitHub Pages</title>
    <style>
      :root {
        --bg: #070b14;
        --bg-elev: #101827;
        --panel: rgba(13, 21, 34, 0.9);
        --border: rgba(143, 171, 255, 0.25);
        --text: #edf5ff;
        --muted: #9fb3cb;
        --cyan: #5ee7ff;
        --purple: #b38bff;
        --pink: #ff5ea8;
        --green: #70f7b3;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(94, 231, 255, 0.12), transparent 30%),
          radial-gradient(circle at bottom right, rgba(179, 139, 255, 0.18), transparent 35%),
          var(--bg);
      }

      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      .hero {
        text-align: center;
        padding: 40px 16px 20px;
      }

      .badge {
        display: inline-block;
        background: rgba(112, 247, 179, 0.09);
        border: 1px solid rgba(112, 247, 179, 0.3);
        color: var(--green);
        border-radius: 999px;
        padding: 8px 14px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.72rem;
      }

      h1 {
        margin: 22px 0 10px;
        font-size: clamp(2.5rem, 7vw, 5rem);
        letter-spacing: -0.05em;
      }

      .gradient {
        background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: var(--muted);
        font-size: 1.06rem;
        margin: 0 auto 12px;
        max-width: 640px;
        line-height: 1.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
        margin-top: 28px;
      }

      .card {
        padding: 22px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
      }

      .label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.72rem;
      }

      h2 {
        margin: 10px 0 0;
        font-size: clamp(1.4rem, 2vw, 2rem);
      }

      .wide {
        grid-column: span 2;
      }

      #timestamp {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 720px) {
        .wide { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="badge">LIVE</div>
        <h1><span class="gradient">Constellation25</span></h1>
        <p class="subtitle">GitHub Pages landing page for the FacePrintPay / Constellation25 sovereign build.</p>
      </header>

      <main class="grid">
        <section class="card status">
          <span class="label">Owner</span>
          <h2>FacePrintPay</h2>
        </section>
        <section class="card status">
          <span class="label">Project</span>
          <h2>constellation25</h2>
        </section>
        <section class="card status wide">
          <span class="label">Status</span>
          <h2>Deploy Ready</h2>
          <p id="timestamp">Loading timestamp...</p>
        </section>
      </main>
    </div>

    <script>
      const timestamp = document.getElementById('timestamp');
      if (timestamp) {
        timestamp.textContent = new Date().toISOString();
      }
    </script>
  </body>
</html>
