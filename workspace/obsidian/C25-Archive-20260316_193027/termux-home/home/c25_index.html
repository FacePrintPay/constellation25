<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C25 Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#e0f0ff;font-family:monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{background:#060e1f;border-bottom:2px solid #00d4ff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#top h1{color:#00d4ff;font-size:1rem}
#search{flex:1;padding:7px 10px;background:#0a1628;border:1px solid #1a4080;color:#fff;border-radius:4px;font-size:0.85rem;font-family:monospace}
#cnt{color:#00ff88;font-size:0.8rem;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:260px;flex-shrink:0;overflow-y:auto;background:#060e1f;border-right:1px solid #1a4080}
.item{padding:10px 12px;border-bottom:1px solid #0d1f3c;cursor:pointer;font-size:0.75rem;color:#94a3b8}
.item:hover{background:#0d1f3c;color:#e0f0ff}
.item.active{background:#1a4080;color:#00d4ff;border-left:3px solid #00d4ff}
.item.hidden{display:none}
.num{color:#334466;font-size:0.65rem;margin-right:4px}
#frame-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
#fname{background:#060e1f;border-bottom:1px solid #1a4080;padding:6px 12px;font-size:0.75rem;color:#00ff88;flex-shrink:0}
iframe{flex:1;border:none;width:100%;height:100%;background:#fff}
</style>
</head><body>
<div id="top">
  <h1>🜚 C25 Viewer</h1>
  <input id="search" placeholder="🔍 Search files..." oninput="filterList()">
  <span id="cnt">Loading...</span>
</div>
<div id="main">
  <div id="sidebar"></div>
  <div id="frame-wrap">
    <div id="fname">← Select a file</div>
    <iframe id="frame" src="about:blank"></iframe>
  </div>
</div>
<script>
fetch('/api/files').then(r=>r.json()).then(files=>{
  var sidebar = document.getElementById('sidebar');
  document.getElementById('cnt').textContent = files.length + ' files';
  files.forEach(function(f, i){
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<span class="num">#'+(i+1)+'</span>'+f.name;
    d.onclick = function(){
      document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      document.getElementById('fname').textContent = '#'+(i+1)+' — '+f.name;
      document.getElementById('frame').src = '/file?path='+encodeURIComponent(f.path);
    };
    sidebar.appendChild(d);
  });
});
function filterList(){
  var q = document.getElementById('search').value.toLowerCase();
  var v = 0;
  document.querySelectorAll('.item').forEach(function(d){
    var m = d.textContent.toLowerCase().includes(q);
    d.classList.toggle('hidden',!m);
    if(m) v++;
  });
  document.getElementById('cnt').textContent = v+' shown';
}
</script>
</body></html>
