<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VideoCourts™ | Justice Stack</title>
  <link rel="stylesheet" href="../../../c25_shared_assets/themes/stargate/theme-stargate.css">
  <style>
    .hero-title { font-size: 2.5rem; text-align: center; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent-glow); }
    .notice-banner { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; color: #f59e0b; padding: 10px; border-radius: 8px; font-size: 0.8rem; text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div style="max-width: 400px; margin: 0 auto; padding: 20px;">
    <!-- Header -->
    <div class="connection-status" style="margin-bottom: 20px;">
      <div class="status-dot"></div>
      <span>VideoCourts™ Network: ONLINE</span>
    </div>
    
    <div class="avatar-portal">
      <span style="font-size: 3rem;">⚖️</span>
    </div>
    
    <h1 class="hero-title">VideoCourts™</h1>
    <p style="text-align: center; color: var(--accent-secondary); margin-bottom: 30px;">Secure Virtual Courtrooms for Modern Justice</p>
    
    <div class="notice-banner">
      ⚠️ Notice: Complies with CA Rules of Court 3.670, NC Gen. Stat. Ch. 7A, SOC 2 Type II, HIPAA
    </div>

    <!-- Action Buttons -->
    <button class="btn-stargate" style="background: var(--accent-secondary); color: #000; border: none;">
      🎤 Start Bio-Enrollment
    </button>
    <button class="btn-stargate">🔍 Search Case</button>
    <button class="btn-stargate">📊 Dashboard</button>
    <button class="btn-stargate">🏛️ Courtroom</button>
    <button class="btn-stargate">📂 Evidence</button>
  </div>
</body>
</html>
